[project]
name = "mppi-gps"
version = "0.1.0"
description = "A minimal 2015-inspired MPPI and action-policy learning loop for MuJoCo Walker"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "h5py>=3.16.0",
    "imageio>=2.37.3",
    "imageio-ffmpeg>=0.6.0",
    "jaxtyping>=0.3.9",
    "matplotlib>=3.8.0",
    "mujoco>=3.1.0",
    "numpy>=1.26.0",
    "scipy>=1.12.0",
    "torch>=2.2.0",
    "tyro>=0.9.0",
]

[project.optional-dependencies]
gpu = ["mujoco-warp>=3.7.0.1"]
test = ["pytest>=8", "hypothesis>=6", "gymnasium[mujoco]>=1.2.3"]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
