[project]
name = "mppi-gps"
version = "0.1.0"
description = "A minimal 2015-inspired MPPI and action-policy learning loop for MuJoCo Walker"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "h5py>=3.16.0",
    "imageio>=2.37.3",
    "imageio-ffmpeg>=0.6.0",
    "jaxtyping>=0.3.9",
    "matplotlib>=3.8.0",
    "mujoco>=3.1.0",
    "numpy>=1.26.0",
    "scipy>=1.12.0",
    "torch==2.10.0",
    "tyro>=0.9.0",
]

[project.optional-dependencies]
gpu = ["mujoco-warp>=3.7.0.1"]
test = ["pytest>=8", "hypothesis>=6", "gymnasium[mujoco]>=1.2.3"]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

# Keep the scientific environment locked while CI installs the Linux CPU wheel.
[dependency-groups]
dev = ["ruff==0.14.3"]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.ruff]
target-version = "py311"
line-length = 100
include = ["src/**/*.py", "scripts/**/*.py", "tests/**/*.py"]
force-exclude = true
extend-exclude = ["archive", "runs", "artifacts", "results", ".venv"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.per-file-ignores]
# Direct-file CLIs bootstrap the existing checkout namespace before importing it.
"scripts/**/*.py" = ["E402"]
# Jaxtyping dimensions are shape expressions, not Python forward references.
"src/envs/{mujoco_env,walker2d}.py" = ["F722"]

[tool.ruff.format]
quote-style = "double"
